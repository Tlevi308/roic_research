  - {concept: "Company name", dictionary: company, column: company}
  - {concept: "Sector", dictionary: sector, column: sector}
  - {concept: "Industry", dictionary: industry, column: industry}
  - {concept: "Fiscal period end date", dictionary: fiscal_period_end_date, column: fiscal_period_end_date}
  - {concept: "Filing date", dictionary: filing_date, column: filing_date}
  - {concept: "Aligned period key (signal quarter)", dictionary: period_key, column: period_key}
  - {concept: "Aligned period year", dictionary: period_year, column: period_year}
  - {concept: "Aligned period quarter", dictionary: period_quarter, column: period_quarter}
  - {concept: "Pipeline run date", dictionary: run_date, column: run_date}
  - {concept: "Row key (period_key_symbol)", dictionary: null, column: KEY}
  - {concept: "Forward quarterly return (evaluation target)", dictionary: null, column: Future_Quarterly_Return}
  - {concept: "Past 3-quarter price momentum", dictionary: null, column: Momentum_3Q}
