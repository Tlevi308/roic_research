# =====================================================================
# ROIC research - configuration
# Every research parameter lives here. Paths are relative to THIS file.
# Source files under ../data are read-only: the pipeline never writes there
# and verifies their SHA-256 hashes before and after each run.
# =====================================================================

project:
  name: roic_trend_future_returns
  stage: 1
  seed: 20260913            # fixed seed for every random operation (tests, bootstraps)

paths:
  panel_csv: ../data/GuruFocus_quarterly_data.csv
  relevance_csv: ../data/stocks_per_quarter.csv
  dictionary_docx: ../data/dictionary_variables.docx
  crosscheck_xlsx: ../data/GuruFocus_quarterly_data.xlsx   # read-only, used for verification only
  output_dir: outputs

# ---------------------------------------------------------------------
# Column names as they appear in the panel CSV (verified in Stage 0)
# ---------------------------------------------------------------------
columns:
  key: KEY
  symbol: symbol
  company: company
  sector: sector
  industry: industry
  period_key: period_key
  fiscal_end: fiscal_period_end_date
  filing_date: filing_date
  run_date: run_date
  forward_return: Future_Quarterly_Return     # NOT documented in the dictionary; verified in Stage 0
  momentum: Momentum_3Q                       # NOT documented in the dictionary; verified in Stage 0
  price: valuations__per_share_data__month_end_stock_price
  market_cap: market_cap
  ebit: ebit
  nopat: calc_nopat_quarterly
  tax_expense: calc_tax_expense_quarterly
  pretax_income: pretax_income
  ic_raw: calc_ic_raw
  avg_ic: calc_average_ic_raw_quarterly
  roic_pretax_file: calc_roic_pretax_quarterly_ic_raw
  roic_posttax_file: calc_roic_posttax_quarterly_ic_raw
  roic_change: calc_roic_posttax_change_quarterly
  c_ebit: calc_roic_ebit_contribution
  c_tax: calc_roic_tax_contribution
  c_ic: calc_roic_ic_contribution
  decomposition_status: calc_roic_decomposition_status
  quality_flag: calc_roic_quality_flag
  econ_valid: calc_roic_economic_interpretation_valid
  debt: calc_debt_value_quarterly
  stockholders_equity: total_stockholders_equity
  de_file: calc_debt_to_equity_quarterly
  relevance_ticker: ticker
  relevance_start: start_quarter
  relevance_end: end_quarter

io:
  csv_encoding: utf-8-sig
  # explicit formats, tried in order; anything else is reported as unparsable
  date_formats:
    fiscal_period_end_date: ["%Y-%m-%d", "%d/%m/%Y"]   # ISO for stocks, DD/MM/YYYY in SPY/QQQ rows
    filing_date: ["%Y-%m-%d"]
    run_date: ["%Y-%m-%d"]
  period_key_regex: '^\d{4}Q[1-4]$'
  boolean_columns:
    - calc_roic_has_opposing_effects
    - calc_roic_economic_interpretation_valid
    - calc_wacc_inputs_complete
    - calc_creates_value
  drop_identical_duplicate_columns: true   # e.g. market_cap.1 (verified identical before dropping)

# ---------------------------------------------------------------------
# Timing convention (confirmed by the researcher)
# period_key = calendar quarter of the first month of the fiscal quarter.
# Portfolio formation = month-end of (period_key quarter end + 2 months).
# Future_Quarterly_Return(t) = formation(t) -> formation(t) + 3 month-ends.
# ---------------------------------------------------------------------
timing:
  quarter_shift_months: 2
  return_horizon_months: 3
  data_as_of: null            # null -> max(run_date) in the panel
  # rows whose fiscal period ended fewer than this many calendar months before formation are FLAGGED, not removed
  # (Dec 31 -> Feb 28 is 2 months = 59 days, so a day-based threshold would wrongly flag calendar quarters)
  min_signal_lag_months: 2

panel:
  benchmark_symbols: [SPY, QQQ]   # not companies; kept aside as benchmark series
  consecutive:
    key_gap_quarters: 1           # previous row must be the previous period_key ...
    min_days: 60                  # ... and fiscal end dates 60-130 days apart (same rule as source pipeline check)
    max_days: 130

# ---------------------------------------------------------------------
# Index relevance (stocks_per_quarter.csv) - confirmed by the researcher 2026-09-13
# member in quarter q  <=>  start_quarter <= q < end_quarter ; empty end = still a member
# ---------------------------------------------------------------------
relevance:
  compare_to: period_key
  start_inclusive: true
  end_inclusive: false
  open_end_is_member_through_latest: true

features:
  trend_window: 4             # x = 0, 1, 2, 3
  # CSV rounds quarterly ROIC to 0.01. 'recompute' rebuilds it with the dictionary
  # formulas (ebit / avg IC ; NOPAT / avg IC). 'file' uses the rounded columns.
  roic_level_source: recompute
  trend_inputs:
    roic_trend_4q: roic_posttax_q
    ebit_contribution_trend_4q: calc_roic_ebit_contribution
    tax_contribution_trend_4q: calc_roic_tax_contribution
    ic_contribution_trend_4q: calc_roic_ic_contribution
  window_aggregates:          # sum and mean of the last 4 contributions
    ebit_contribution: calc_roic_ebit_contribution
    tax_contribution: calc_roic_tax_contribution
    ic_contribution: calc_roic_ic_contribution
  raw_ic_change: true         # raw change in average IC, so a contribution slope is not read as a capital change

returns:
  # The file stores 0.0 where the return window has not ended yet (period 2026Q2).
  # true -> set to NaN when window end > data_as_of. Never fills NaN with 0.
  unrealized_to_nan: true
  # Momentum_3Q == 0.0 exactly marks missing history in the source (xlsx Price sheet has NaN there).
  momentum_exact_zero_to_nan: true
  # 0.0 is not a possible value for these fields (e.g. pre-IPO quarters store market_cap = 0).
  # A derived <name> column gets NaN there; the original column is kept unchanged.
  zero_means_missing:
    market_cap: market_cap_clean
    valuations__per_share_data__month_end_stock_price: price_clean

validation:
  xlsx_crosscheck: true       # compare CSV against the full-precision xlsx (read-only)
  rounding_step_2dp: 0.005
  rounding_step_6dp: 0.0000005
  max_decimals_rounded_threshold: 2

# ---------------------------------------------------------------------
